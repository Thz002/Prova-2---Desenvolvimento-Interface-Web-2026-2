<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado | A Fazenda 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-dark navbar-fazenda">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="img/logo.png" alt="Logo A Fazenda" height="36">
        <span class="titulo-fazenda">Votação 2026</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
              aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto gap-md-1">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="votacao.html">Votar</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="resultado.html">Resultado</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="titulo-fazenda mb-1">Parcial da eliminação</h1>
    <p class="mb-4">
      <span id="total" class="titulo-fazenda fs-3">0</span>
      <span id="texto-total" class="subtitulo small">votos computados</span>
    </p>

    <div id="alerta"></div>

    <div id="placar"></div>

    <button type="button" id="btn-zerar" class="btn btn-outline-light btn-sm d-none"
            data-bs-toggle="modal" data-bs-target="#modalZerar">
      Zerar votação
    </button>
  </main>

  <footer class="rodape text-center py-4 small">DIW 2026, PUC Minas</footer>

  <div class="modal fade" id="modalZerar" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-dark">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="tituloModal">Zerar votação</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          Tem certeza que deseja apagar todos os votos? Essa ação não pode ser desfeita.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btn-confirmar-zerar" class="btn btn-danger">Zerar votação</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/resultado.js"></script>
</body>
</html>
